name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXTRACTION_MODE: ocr
      OCR_LANGUAGES: eng
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
            notebooks/requirements.txt
            tests/requirements.txt
      - name: Audit repository contents
        run: python scripts/audit_repository.py
      - name: Install OCR and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils fonts-dejavu-core
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt -r frontend/requirements.txt -r notebooks/requirements.txt -r tests/requirements.txt
      - name: Backend regressions (no weights or datasets required)
        run: python -m unittest discover -s tests -v
      - name: Rendered dashboard regressions
        run: python -m unittest discover -s frontend/tests -v

  public-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build complete public website image
        run: docker build -t finance-public .
      - name: Verify both services become ready
        run: |
          docker run -d --name finance-public -p 8501:8501 finance-public
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs finance-public; exit 1; fi
          docker exec finance-public python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['ocr_available']"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs finance-public || true
          docker rm -f finance-public || true
