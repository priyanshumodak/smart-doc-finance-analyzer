services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      EXTRACTION_MODE: ${EXTRACTION_MODE:-ocr}
      MODEL_NAME: ${MODEL_NAME:-impira/layoutlm-invoices}
      TOKEN_MODEL_PATH: ${TOKEN_MODEL_PATH:-}
      RELATION_MODEL_PATH: ${RELATION_MODEL_PATH:-}
      TOKEN_MIN_CONFIDENCE: ${TOKEN_MIN_CONFIDENCE:-0.5}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+hin}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_PAGES: ${MAX_PAGES:-20}
      DATABASE_PATH: /app/storage/documents.sqlite3
      HF_HOME: /app/model-cache
    volumes:
      - document-data:/app/storage
      - model-cache:/app/model-cache
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  document-data:
  model-cache:
